<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسلسل — القصص الأسطورية</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#060608;--card:#0f0f14;--red:#9b1a1a;--red-bright:#cc2222;
      --gold:#c8a84b;--gold-dim:#8a7030;--text:#d8d0c8;--text-dim:#7a7268;
      --white:#f0ece4;--border:#1e1e28;--green:#22aa55;--teal:#22A896;
      --radius:4px;
    }
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh}

    /* NAV */
    nav{position:fixed;top:0;left:0;right:0;z-index:200;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:rgba(6,6,8,0.97);border-bottom:1px solid var(--border)}
    .nav-logo{font-family:'Amiri',serif;font-size:1.2rem;color:var(--gold);text-decoration:none}
    .nav-back{display:flex;align-items:center;gap:0.5rem;color:var(--text-dim);text-decoration:none;font-size:0.82rem;font-weight:600;transition:color 0.2s;letter-spacing:0.05em}
    .nav-back:hover{color:var(--gold)}
    .nav-back svg{width:16px;height:16px;transform:rotate(180deg)}

    /* HERO */
    .hero{position:relative;min-height:420px;display:flex;align-items:flex-end;padding:2rem;margin-top:58px;overflow:hidden}
    .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center top;filter:brightness(0.35) saturate(0.7)}
    .hero-gradient{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,rgba(6,6,8,0.7) 50%,rgba(6,6,8,0.2) 100%)}
    .hero-gradient-side{position:absolute;inset:0;background:linear-gradient(to left,transparent 40%,rgba(6,6,8,0.9) 100%)}
    .hero-content{position:relative;z-index:2;max-width:700px}
    .hero-cat{font-size:0.68rem;font-weight:700;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;margin-bottom:0.5rem}
    .hero-title{font-family:'Amiri',serif;font-size:clamp(1.8rem,5vw,3rem);color:var(--white);line-height:1.2;margin-bottom:0.35rem}
    .hero-orig{font-size:0.8rem;color:var(--text-dim);margin-bottom:0.75rem;font-style:italic}
    .hero-meta{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
    .hero-meta span{font-size:0.78rem;color:var(--text-dim)}
    .hero-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text-dim)}
    .hero-rating{color:var(--gold);font-weight:700;font-size:0.82rem}
    .hero-badge{padding:0.2rem 0.6rem;border:1px solid rgba(200,168,75,0.4);color:var(--gold);font-size:0.68rem;font-weight:700;letter-spacing:0.1em}
    .hero-status{padding:0.2rem 0.6rem;font-size:0.68rem;font-weight:700;letter-spacing:0.1em}
    .hero-desc{font-size:0.88rem;color:var(--text-dim);line-height:1.8;max-width:560px;margin-bottom:1.25rem}
    .hero-stats{display:flex;gap:1.5rem;flex-wrap:wrap}
    .stat{display:flex;flex-direction:column}
    .stat-val{font-size:1.4rem;font-weight:700;color:var(--white);line-height:1}
    .stat-label{font-size:0.68rem;color:var(--text-dim);margin-top:0.2rem;letter-spacing:0.05em}

    /* MAIN CONTENT */
    .main{max-width:1200px;margin:0 auto;padding:2rem 2rem 4rem}

    /* SEASON TABS */
    .season-tabs{display:flex;gap:0.5rem;margin-bottom:2rem;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:0}
    .s-tab{padding:0.6rem 1.25rem;border:none;background:none;color:var(--text-dim);font-family:'Cairo',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.25s;letter-spacing:0.03em;white-space:nowrap}
    .s-tab:hover{color:var(--text)}
    .s-tab.active{color:var(--gold);border-bottom-color:var(--gold)}

    /* EPISODES GRID */
    .episodes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
    .ep-card{background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all 0.25s;position:relative;overflow:hidden}
    .ep-card:hover{border-color:rgba(200,168,75,0.35);transform:translateY(-2px)}
    .ep-thumb-wrap{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0a0a0f}
    .ep-thumb{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(0.85);transition:filter 0.3s}
    .ep-card:hover .ep-thumb{filter:brightness(1)}
    .ep-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.25s;background:rgba(0,0,0,0.3)}
    .ep-card:hover .ep-play{opacity:1}
    .ep-play svg{width:44px;height:44px;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.7))}
    .ep-num-badge{position:absolute;top:0.4rem;right:0.4rem;background:rgba(0,0,0,0.75);padding:0.15rem 0.4rem;font-size:0.65rem;font-weight:700;color:var(--white)}
    .ep-lang-badges{position:absolute;bottom:0.4rem;left:0.4rem;display:flex;gap:0.25rem;flex-wrap:wrap}
    .ep-lang{padding:0.1rem 0.3rem;font-size:0.58rem;font-weight:700;background:rgba(0,0,0,0.7);color:var(--teal);border:1px solid rgba(34,168,150,0.4)}
    .ep-body{padding:0.6rem 0.75rem}
    .ep-title{font-size:0.8rem;color:var(--white);line-height:1.4;margin-bottom:0.3rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ep-info{display:flex;align-items:center;gap:0.5rem;font-size:0.68rem;color:var(--text-dim)}
    .ep-duration{color:var(--text-dim)}

    /* EMPTY STATE */
    .empty-state{text-align:center;padding:4rem 2rem;color:var(--text-dim)}
    .empty-state h3{font-family:'Amiri',serif;font-size:1.4rem;color:var(--text-dim);margin-bottom:0.5rem}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:500;display:none;align-items:center;justify-content:center;padding:1rem}
    .modal-overlay.open{display:flex}
    .modal{background:var(--card);border:1px solid var(--border);width:100%;max-width:860px;position:relative;overflow:hidden}
    .modal-close{position:absolute;top:0.75rem;left:0.75rem;z-index:10;width:32px;height:32px;border:1px solid var(--border);background:rgba(0,0,0,0.5);color:var(--text-dim);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
    .modal-close:hover{background:rgba(155,26,26,0.3);color:var(--red-bright);border-color:rgba(155,26,26,0.5)}
    .modal-player{position:relative;aspect-ratio:16/9;background:#000}
    .modal-player iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
    .modal-info{padding:1rem 1.25rem}
    .modal-title{font-family:'Amiri',serif;font-size:1.1rem;color:var(--white);margin-bottom:0.75rem}
    .modal-langs{display:flex;gap:0.5rem;flex-wrap:wrap}
    .lang-btn{padding:0.35rem 0.9rem;border:1px solid var(--border);color:var(--text-dim);background:none;font-family:'Cairo',sans-serif;font-size:0.75rem;font-weight:600;cursor:pointer;transition:all 0.2s;letter-spacing:0.03em}
    .lang-btn:hover{border-color:var(--teal);color:var(--teal)}
    .lang-btn.active{background:rgba(34,168,150,0.15);border-color:var(--teal);color:var(--teal)}

    /* 404 */
    .not-found{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:1rem}
    .not-found h2{font-family:'Amiri',serif;font-size:2rem;color:var(--text-dim)}

    /* GENRES */
    .genres{display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.75rem}
    .genre-tag{padding:0.15rem 0.55rem;background:rgba(200,168,75,0.06);border:1px solid rgba(200,168,75,0.2);color:var(--text-dim);font-size:0.68rem}

    /* DARIJA BLOCK */
    .darija-block{margin-top:0.85rem;padding:0.75rem 1rem;background:rgba(34,168,150,0.07);border:1px solid rgba(34,168,150,0.22);border-right:3px solid var(--teal)}
    .darija-label{font-size:0.62rem;font-weight:700;letter-spacing:0.15em;color:var(--teal);margin-bottom:0.35rem;text-transform:uppercase}
    .darija-text{font-size:0.83rem;color:var(--text);line-height:1.9}

    /* EMBED WARNING */
    .embed-warn{display:inline-flex;align-items:center;gap:0.4rem;margin-top:0.75rem;padding:0.35rem 0.75rem;background:rgba(155,26,26,0.12);border:1px solid rgba(155,26,26,0.35);color:#d97a7a;font-size:0.72rem}

    /* EP SOURCE */
    .ep-source{font-size:0.62rem;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;margin-top:0.15rem}

    @media(max-width:640px){
      .hero{padding:1.25rem;min-height:340px}
      .hero-title{font-size:1.6rem}
      .hero-stats{gap:1rem}
      .main{padding:1.25rem 1rem 3rem}
      .episodes-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.75rem}
      nav{padding:0 1rem}
    }
  </style>
</head>
<body>

<nav>
  <a href="videos.html" class="nav-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    مكتبة المسلسلات التركية
  </a>
  <a href="index.html" class="nav-logo">القصص الأسطورية</a>
</nav>

<!-- HERO -->
<div class="hero" id="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-gradient"></div>
  <div class="hero-gradient-side"></div>
  <div class="hero-content" id="hero-content"></div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="season-tabs" id="season-tabs"></div>
  <div id="episodes-container"></div>
</div>

<!-- MODAL PLAYER -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-player">
      <iframe id="modal-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="modal-info">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-langs" id="modal-langs"></div>
      <div id="modal-extra"></div>
    </div>
  </div>
</div>

<script src="videos-data.js?v=19"></script>
<script>
const AUDIO_LABELS = { ar:'العربية', darija:'الدارجة 🇲🇦', tr:'التركية', fr:'Français' };

// ── Parse URL ──────────────────────────────────────────
const params = new URLSearchParams(location.search);
const seriesId = params.get('id') || '';

// ── Status helper ──────────────────────────────────────
function getStatus(avail, total, explicitStatus) {
  if (explicitStatus === 'complete') return { label:'مكتملة ✓', color:'var(--green)' };
  if (explicitStatus === 'hidden')   return { label:'مخفية', color:'var(--text-dim)' };
  if (!total) return { label:'حلقات مختارة', color:'#d6ad5e' };
  const p = avail / total;
  if (p >= 0.85 || explicitStatus === 'complete')     return { label:'مكتملة ✓', color:'var(--green)' };
  if (p >= 0.60 || explicitStatus === 'near_complete') return { label:'شبه مكتملة', color:'var(--teal)' };
  if (p >= 0.08 || explicitStatus === 'partial')       return { label:'قيد الإكمال', color:'var(--gold)' };
  return { label:'حلقات مختارة', color:'#d6ad5e' };
}

// ── Get audio tracks ───────────────────────────────────
function getTracks(v) {
  const tracks = {};
  if (v.langs) Object.assign(tracks, v.langs);
  if (v.audio) Object.assign(tracks, v.audio);
  if (!Object.keys(tracks).length && v.ytId) tracks.ar = v.ytId;
  return tracks;
}

// ── Init ───────────────────────────────────────────────
function init() {
  if (!seriesId || typeof SERIES_INFO === 'undefined' || !SERIES_INFO[seriesId]) {
    document.getElementById('hero').style.display = 'none';
    document.querySelector('.main').innerHTML = `
      <div class="not-found">
        <h2>السلسلة غير موجودة</h2>
        <p style="color:var(--text-dim);font-size:0.9rem">المعرّف "${seriesId}" غير معروف</p>
        <a href="videos.html" style="color:var(--gold);font-size:0.85rem;margin-top:0.5rem">← العودة إلى المكتبة</a>
      </div>`;
    return;
  }

  const info = SERIES_INFO[seriesId];
  const allEps = (VIDEO_LIBRARY || []).filter(v => v.series === seriesId);

  // Update page title
  document.title = `${info.title} — القصص الأسطورية`;

  // Build hero
  buildHero(info, allEps);

  // Build season tabs + grids
  buildEpisodes(info, allEps);
}

function buildHero(info, allEps) {
  // Background
  const bg = document.getElementById('hero-bg');
  if (info.poster) bg.style.backgroundImage = `url(${info.poster})`;

  const status = getStatus(allEps.length, info.totalEps, info.status);
  const genres = (info.genre || []).map(g => `<span class="genre-tag">${g}</span>`).join('');

  document.getElementById('hero-content').innerHTML = `
    <div class="hero-cat">${info.cat || 'مسلسل'}</div>
    <h1 class="hero-title">${info.title}</h1>
    ${info.titleOrig ? `<p class="hero-orig">${info.titleOrig}</p>` : ''}
    <div class="genres">${genres}</div>
    <div class="hero-meta">
      ${info.year ? `<span>${info.year}</span><span class="dot"></span>` : ''}
      ${info.seasons ? `<span>${info.seasons} موسم</span><span class="dot"></span>` : ''}
      ${info.rating ? `<span class="hero-rating">★ ${info.rating}</span><span class="dot"></span>` : ''}
      ${info.badge ? `<span class="hero-badge">${info.badge}</span>` : ''}
      <span class="hero-status" style="color:${status.color};border:1px solid ${status.color};padding:0.15rem 0.5rem;font-size:0.68rem;font-weight:700">${status.label}</span>
    </div>
    ${info.desc ? `<p class="hero-desc">${info.desc}</p>` : ''}
    <div class="hero-stats">
      <div class="stat"><span class="stat-val">${allEps.length}</span><span class="stat-label">حلقة متاحة${info.totalEps ? ` من ${info.totalEps}` : ''}</span></div>
      ${info.seasons ? `<div class="stat"><span class="stat-val">${info.seasons}</span><span class="stat-label">موسم</span></div>` : ''}
      ${info.year ? `<div class="stat"><span class="stat-val">${info.year}</span><span class="stat-label">سنة الإنتاج</span></div>` : ''}
    </div>`;
}

function buildEpisodes(info, allEps) {
  // Group by season
  const bySeasonMap = {};
  allEps.forEach(ep => {
    const s = ep.season || '1';
    if (!bySeasonMap[s]) bySeasonMap[s] = [];
    bySeasonMap[s].push(ep);
  });

  // Sort seasons
  const seasonKeys = Object.keys(bySeasonMap).sort((a, b) => {
    const na = parseInt(a), nb = parseInt(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return a.localeCompare(b);
  });

  if (!seasonKeys.length) {
    document.getElementById('episodes-container').innerHTML = `
      <div class="empty-state">
        <h3>لا توجد حلقات متاحة بعد</h3>
        <p>نعمل على إضافة حلقات هذه السلسلة قريباً</p>
      </div>`;
    return;
  }

  const tabsEl = document.getElementById('season-tabs');
  const contEl = document.getElementById('episodes-container');

  const seasonLabel = s => {
    const n = parseInt(s);
    if (!isNaN(n)) {
      const labels = ['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر'];
      return 'الموسم ' + (labels[n - 1] || n);
    }
    return 'الموسم ' + s;
  };

  // Render tabs
  tabsEl.innerHTML = seasonKeys.map((s, i) => `
    <button class="s-tab${i === 0 ? ' active' : ''}" onclick="switchSeason('${s}', this)">${seasonLabel(s)} <span style="color:var(--text-dim);font-size:0.72em">(${bySeasonMap[s].length})</span></button>
  `).join('');

  // Render grids (all, hidden except first)
  contEl.innerHTML = seasonKeys.map((s, i) => {
    const eps = bySeasonMap[s].slice().sort((a, b) => {
      const na = parseInt(a.episode), nb = parseInt(b.episode);
      if (!isNaN(na) && !isNaN(nb)) return na - nb;
      return 0;
    });
    return `<div class="season-panel${i === 0 ? '' : ' hidden'}" id="season-${s}" style="${i === 0 ? '' : 'display:none'}">
      <div class="episodes-grid">
        ${eps.map(ep => renderEpCard(ep)).join('')}
      </div>
    </div>`;
  }).join('');
}

function renderEpCard(ep) {
  const tracks = getTracks(ep);
  const mainId = ep.ytId || Object.values(tracks)[0] || '';
  const thumb = mainId ? `https://img.youtube.com/vi/${mainId}/mqdefault.jpg` : '';
  const epNum = ep.episode ? `ح${ep.episode}` : '';
  const langKeys = Object.keys(tracks).filter(k => tracks[k]);
  const langBadges = langKeys.map(k => `<span class="ep-lang">${(AUDIO_LABELS[k] || k).split(' ')[0]}</span>`).join('');

  return `<div class="ep-card" onclick='openEpisode(${JSON.stringify(ep).replace(/'/g,"&#39;")})'>
    <div class="ep-thumb-wrap">
      ${thumb ? `<img class="ep-thumb" src="${thumb}" alt="${ep.title}" loading="lazy" onerror="this.src='https://img.youtube.com/vi/default/mqdefault.jpg'">` : '<div style="width:100%;height:100%;background:#0a0a0f"></div>'}
      <div class="ep-play"><svg viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="10" fill="rgba(0,0,0,0.5)"/><polygon points="10,8 16,12 10,16" fill="white"/></svg></div>
      ${epNum ? `<span class="ep-num-badge">${epNum}</span>` : ''}
      ${langBadges ? `<div class="ep-lang-badges">${langBadges}</div>` : ''}
    </div>
    <div class="ep-body">
      <div class="ep-title">${ep.title}</div>
      <div class="ep-info">
        ${ep.duration ? `<span class="ep-duration">⏱ ${ep.duration}</span>` : ''}
        ${ep.darijaDesc ? `<span style="color:var(--teal);font-size:0.62rem">🇲🇦 دارجة</span>` : ''}
      </div>
      ${ep.source ? `<div class="ep-source">${ep.source}</div>` : ''}
    </div>
  </div>`;
}

function switchSeason(key, btn) {
  document.querySelectorAll('.s-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.season-panel').forEach(p => p.style.display = 'none');
  const panel = document.getElementById('season-' + key);
  if (panel) panel.style.display = '';
}

// ── Modal player ───────────────────────────────────────
let currentEp = null;

function openEpisode(ep) {
  currentEp = ep;
  const tracks = getTracks(ep);
  const firstLang = Object.keys(tracks).find(k => tracks[k]) || 'ar';
  playTrack(tracks[firstLang] || ep.ytId, firstLang, ep, tracks);
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function playTrack(ytId, lang, ep, tracks) {
  document.getElementById('modal-iframe').src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0`;
  document.getElementById('modal-title').textContent = ep.title;

  const langKeys = Object.keys(tracks).filter(k => tracks[k]);
  document.getElementById('modal-langs').innerHTML = langKeys.length > 1
    ? `<span style="font-size:0.72rem;color:var(--text-dim);margin-left:0.5rem">النسخة المتوفرة:</span>` +
      langKeys.map(k => `<button class="lang-btn${k === lang ? ' active' : ''}" onclick="switchLang('${k}','${tracks[k]}',this)">${AUDIO_LABELS[k] || k}</button>`).join('')
    : '';

  let extra = '';
  if (ep.embeddable === false) {
    extra += `<div class="embed-warn">⚠ هذا الفيديو قد لا يُشغَّل هنا — شاهده مباشرة على YouTube</div>`;
  }
  if (ep.darijaDesc) {
    extra += `<div class="darija-block"><div class="darija-label">ملخص بالدارجة 🇲🇦</div><p class="darija-text">${ep.darijaDesc}</p></div>`;
  }
  document.getElementById('modal-extra').innerHTML = extra;
}

function switchLang(lang, ytId, btn) {
  if (!currentEp) return;
  document.getElementById('modal-iframe').src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0`;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal-iframe').src = '';
  document.body.style.overflow = '';
  currentEp = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

init();
</script>
</body>
</html>
