<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا — القصص الأسطورية</title>
  <meta name="description" content="تواصل مع فريق القصص الأسطورية — للاقتراحات والتعاون والإعلانات.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#06060A;--surface:#0D0D15;--card:#111118;--red-bright:#C41E3A;--gold:#C9A84C;--gold-dim:rgba(201,168,76,0.12);--text:#D4CCC4;--text-dim:#6B6560;--white:#F0EAE0;--border:rgba(255,255,255,0.06)}
    body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh}
    nav{position:fixed;top:0;left:0;right:0;z-index:200;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem;background:rgba(6,6,10,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .nav-logo{font-family:'Amiri',serif;font-size:1.35rem;color:var(--gold);text-decoration:none}
    .back-btn{color:var(--text-dim);text-decoration:none;font-size:.82rem;transition:color .25s}
    .back-btn:hover{color:var(--gold)}
    .page-wrap{max-width:640px;margin:0 auto;padding:120px 2.5rem 6rem;text-align:center}
    .page-tag{font-size:.6rem;font-weight:700;letter-spacing:.4em;color:var(--red-bright);text-transform:uppercase;display:block;margin-bottom:1rem}
    h1{font-family:'Amiri',serif;font-size:2.2rem;color:var(--white);margin-bottom:.75rem}
    .page-sub{font-size:.9rem;color:var(--text-dim);line-height:1.9;margin-bottom:3rem}
    .contact-form{background:var(--surface);border:1px solid var(--border);padding:2.5rem;text-align:right}
    .form-group{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.25rem}
    label{font-size:.75rem;color:var(--text-dim);font-weight:600;letter-spacing:.05em}
    input,select,textarea{padding:.7rem 1rem;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text);font-family:'Cairo',sans-serif;font-size:.9rem;outline:none;transition:border-color .25s;width:100%}
    input:focus,select:focus,textarea:focus{border-color:rgba(201,168,76,.4)}
    input::placeholder,textarea::placeholder{color:var(--text-dim);opacity:.5}
    select option{background:#111118}
    textarea{min-height:130px;resize:vertical;line-height:1.7}
    .submit-btn{width:100%;padding:.8rem;background:var(--red-bright);border:none;color:var(--white);font-family:'Cairo',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;letter-spacing:.08em;transition:all .3s;margin-top:.5rem}
    .submit-btn:hover{background:#a01830;transform:translateY(-1px)}
    .or-section{margin:2.5rem 0;display:flex;align-items:center;gap:1rem}
    .or-line{flex:1;height:1px;background:var(--border)}
    .or-text{font-size:.72rem;color:var(--text-dim);letter-spacing:.15em}
    .direct-links{display:flex;flex-direction:column;gap:.75rem;text-align:right}
    .direct-link{display:flex;align-items:center;gap:.75rem;padding:1rem 1.25rem;background:var(--surface);border:1px solid var(--border);color:var(--text);text-decoration:none;transition:all .25s}
    .direct-link:hover{border-color:rgba(201,168,76,.2);color:var(--gold)}
    .direct-link-icon{font-size:1.1rem;flex-shrink:0}
    .direct-link-text{flex:1}
    .direct-link-label{font-size:.75rem;font-weight:600;color:var(--text-dim);display:block;margin-bottom:.15rem;letter-spacing:.05em}
    .direct-link-val{font-size:.9rem}
    footer{border-top:1px solid var(--border);padding:2.5rem;text-align:center}
    .footer-logo{font-family:'Amiri',serif;font-size:1.4rem;color:var(--gold);margin-bottom:.5rem}
    .footer-text{font-size:.72rem;color:var(--text-dim)}
    @media(max-width:640px){.page-wrap{padding:100px 1.25rem 5rem}}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">القصص الأسطورية</a>
  <a href="index.html" class="back-btn">→ العودة للرئيسية</a>
</nav>

<div class="page-wrap">
  <span class="page-tag">◆ تواصل معنا</span>
  <h1>نحن هنا للاستماع</h1>
  <p class="page-sub">للاقتراحات، التعاون، الإعلانات، أو أي استفسار — يسعدنا التواصل معك</p>

  <form class="contact-form" onsubmit="sendMessage(event)">
    <div class="form-group">
      <label>موضوع الرسالة</label>
      <select>
        <option value="">اختر الموضوع</option>
        <option value="suggestion">اقتراح أو فكرة</option>
        <option value="ads">إعلانات وتعاون</option>
        <option value="story">اقتراح قصة</option>
        <option value="bug">مشكلة تقنية</option>
        <option value="other">أخرى</option>
      </select>
    </div>
    <div class="form-group">
      <label>اسمك</label>
      <input type="text" placeholder="اسمك الكريم" required>
    </div>
    <div class="form-group">
      <label>بريدك الإلكتروني</label>
      <input type="email" placeholder="example@email.com" required>
    </div>
    <div class="form-group">
      <label>رسالتك</label>
      <textarea placeholder="اكتب رسالتك هنا..." required></textarea>
    </div>
    <button type="submit" class="submit-btn">إرسال الرسالة ←</button>
  </form>

  <div class="or-section">
    <div class="or-line"></div>
    <span class="or-text">أو تواصل مباشرة</span>
    <div class="or-line"></div>
  </div>

  <div class="direct-links">
    <a href="https://wa.me/" class="direct-link">
      <span class="direct-link-icon">💬</span>
      <div class="direct-link-text">
        <span class="direct-link-label">واتساب</span>
        <span class="direct-link-val">للتواصل السريع</span>
      </div>
      <span>←</span>
    </a>
    <a href="#" class="direct-link">
      <span class="direct-link-icon">📺</span>
      <div class="direct-link-text">
        <span class="direct-link-label">يوتيوب</span>
        <span class="direct-link-val">قناة القصص الأسطورية</span>
      </div>
      <span>←</span>
    </a>
    <a href="#" class="direct-link">
      <span class="direct-link-icon">📱</span>
      <div class="direct-link-text">
        <span class="direct-link-label">تيك توك وإنستغرام</span>
        <span class="direct-link-val">@qisas.asturiya</span>
      </div>
      <span>←</span>
    </a>
  </div>
</div>

<footer>
  <div class="footer-logo">القصص الأسطورية</div>
  <p class="footer-text">© ٢٠٢٦ — <a href="privacy.html" style="color:inherit">سياسة الخصوصية</a> | <a href="about.html" style="color:inherit">من نحن</a></p>
</footer>

<script>
function sendMessage(e){
  e.preventDefault();
  e.target.innerHTML='<div style="text-align:center;padding:3rem;font-family:Amiri,serif;font-size:1.2rem;color:#C9A84C">✦ شكراً! تم إرسال رسالتك بنجاح. سنرد عليك قريباً.</div>';
}
</script>
</body>
</html>
